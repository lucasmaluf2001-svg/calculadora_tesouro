name: Atualizar dados do Tesouro

on:
  schedule:
    # 19:37 no horário de Brasília (UTC-3), fora do pico de início da hora.
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Instalar dependências da atualização
        run: pip install -r requirements-update.txt

      - name: Atualizar snapshot pelas fontes oficiais
        run: python -c "from app.services.snapshot import update_runtime_snapshot; update_runtime_snapshot()"

      - name: Validar o pacote estático
        run: python build_static.py

      - name: Registrar snapshot novo
        shell: bash
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "A fonte ainda não publicou dados novos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Atualizar dados do Tesouro"
          git push
